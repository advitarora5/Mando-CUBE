name: Discovery execution (approval gated)

# Manual only. Add a recurring trigger only after rollout approval and measured runs.
# No migrations or paid enrichment are executed by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mando-cube-ingestion
  cancel-in-progress: false

jobs:
  discovery:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.DISCOVERY_EXECUTION_ENABLED == 'true' &&
      vars.DISCOVERY_SINGLE_WRITER_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run bounded discovery
        env:
          DISCOVERY_EXECUTION_ENABLED: ${{ vars.DISCOVERY_EXECUTION_ENABLED }}
          DISCOVERY_SINGLE_WRITER_CONFIRMED: ${{ vars.DISCOVERY_SINGLE_WRITER_CONFIRMED }}
          DISCOVERY_APPROVED_PROJECT_REF: ${{ vars.DISCOVERY_APPROVED_PROJECT_REF }}
          PIPELINE_SUPABASE_URL: ${{ secrets.PIPELINE_SUPABASE_URL }}
          PIPELINE_SUPABASE_KEY: ${{ secrets.PIPELINE_SUPABASE_KEY }}
          PIPELINE_ALLOW_REMOTE: ${{ vars.PIPELINE_ALLOW_REMOTE }}
        run: node scripts/discovery-execute-approved.mjs
      - name: Retain safe run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}
          path: var/discovery/runs/*/summary.json
          if-no-files-found: ignore
          retention-days: 7
